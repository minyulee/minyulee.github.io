<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이유민 TO-DO LIST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,"Noto Sans KR",sans-serif}
.container{max-width:520px;margin:auto;padding:28px 22px;min-height:100vh}
.date{font-size:20px;font-weight:bold;margin-bottom:8px}
h1{font-size:32px;margin:0 0 28px}
.list{margin-bottom:28px}
.task{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding:17px 4px}
.task input[type=checkbox]{width:25px;height:25px;accent-color:#000;flex-shrink:0}
.task input[type=text]{border:0;outline:0;width:100%;font-size:21px;color:#000;background:#fff}
.task input[type=text]::placeholder{color:#888}
.task.done input[type=text]{text-decoration:line-through;color:#888}
.message{border-top:2px solid #000;padding:20px 0;text-align:center;font-size:18px;font-weight:bold;line-height:1.5}
.calculator{border-top:2px solid #000;margin-top:25px;padding-top:22px}
.calculator h2{font-size:24px;margin:0 0 18px}
.input-box{margin-bottom:14px}
.input-box label{display:block;font-size:16px;font-weight:bold;margin-bottom:7px}
.input-box input{width:100%;padding:13px;border:2px solid #000;font-size:18px;outline:none}
.result{margin-top:18px;padding:18px;text-align:center;background:#f5f5f5}
.result span{display:block;font-size:16px;margin-bottom:6px}
.result strong{font-size:28px}
@media(max-width:400px){
.container{padding:22px 18px}
h1{font-size:28px}
.task input[type=text]{font-size:19px}
}
</style>
</head>
<body>
<div class="container">
  <div class="date" id="date"></div>
  <h1>할 일 목록</h1>

  <div class="list" id="list"></div>

  <div class="message" id="message"></div>

  <div class="calculator">
    <h2>모임 회비 나누기</h2>

    <div class="input-box">
      <label for="total">총 금액 (원)</label>
      <input id="total" type="number" min="0" placeholder="예: 120000">
    </div>

    <div class="input-box">
      <label for="people">인원</label>
      <input id="people" type="number" min="1" step="1" placeholder="예: 6">
    </div>

    <div class="result">
      <span>1인당 금액</span>
      <strong id="result">0원</strong>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY="yumin_todo_list";
const messages=[
"오늘의 작은 실천이 내일의 나를 만든다.",
"완벽하게보다, 하나라도 끝내는 것에 집중하자.",
"조금씩이라도 계속하면 결국 원하는 곳에 도착한다.",
"오늘 할 일을 오늘 해낸 나를 믿자.",
"미래의 나에게 가장 좋은 선물은 오늘의 실행이다.",
"할 수 있는 것부터 하나씩 시작하자.",
"천천히 가도 멈추지 않으면 된다.",
"오늘의 노력은 반드시 나의 실력이 된다.",
"해야 할 일을 해낸 하루는 충분히 멋지다.",
"지금의 한 걸음이 원하는 미래와 가장 가깝다."
];

function today(){
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];
  document.getElementById("date").textContent=
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function load(){
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  const tasks=saved||["","","","","",""];
  tasks.forEach((task,i)=>createTask(i,task.text||task,task.done||false));
}

function save(){
  const data=[...document.querySelectorAll(".task")].map(t=>({
    text:t.querySelector("input[type=text]").value,
    done:t.querySelector("input[type=checkbox]").checked
  }));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function createTask(i,text,done){
  const row=document.createElement("div");
  row.className="task"+(done?" done":"");

  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=done;

  const input=document.createElement("input");
  input.type="text";
  input.placeholder=`할 일 ${i+1}`;
  input.value=text;

  check.addEventListener("change",()=>{
    row.classList.toggle("done",check.checked);
    save();
  });
  input.addEventListener("input",save);

  row.append(check,input);
  document.getElementById("list").appendChild(row);
}

function dailyMessage(){
  const start=new Date(2026,0,1);
  const now=new Date();
  const day=Math.floor((now-start)/86400000);
  document.getElementById("message").textContent=
    "“"+messages[((day%messages.length)+messages.length)%messages.length]+"”";
}

function calculate(){
  const total=Number(document.getElementById("total").value);
  const people=Number(document.getElementById("people").value);
  const result=document.getElementById("result");

  if(total>0 && people>0){
    result.textContent=Math.round(total/people).toLocaleString()+"원";
  }else{
    result.textContent="0원";
  }
}

document.getElementById("total").addEventListener("input",calculate);
document.getElementById("people").addEventListener("input",calculate);

today();
load();
dailyMessage();
</script>
</body>
</html>
