<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이유민 | Mobile Card</title>
<style>
:root{
  --main:#ffffff; /* 메인 글자 및 테두리 색상: 흰색 */
  --bg:#00CCFF;   /* 전체 배경 색상: 하늘색 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:var(--bg);
  color:var(--main);
  min-height:100vh;
}
.card{
  min-height:100vh;
  max-width:480px;
  margin:auto;
  padding:42px 28px 40px;
  display:flex;
  flex-direction:column;
}
.top{padding-bottom:35px}
.label{
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:18px;
}
h1{
  font-size:48px;
  line-height:1.05;
  letter-spacing:-3px;
  margin-bottom:18px;
}
.intro{
  font-size:20px;
  line-height:1.55;
  font-weight:500;
  letter-spacing:-1px;
}
.work{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:35px;
}
.work-title{
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:8px;
}
.work-item{
  border-top:2px solid var(--main);
  padding:18px 4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.work-item span{
  font-size:27px;
  font-weight:700;
  letter-spacing:-1.5px;
}
.arrow{
  font-size:25px;
}

/* 모임 회비 계산기 스타일 */
.calc-section{
  border-top:2px solid var(--main);
  padding-top:25px;
  margin-bottom:30px;
}
.calc-title{
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:16px;
}
.calc-box{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.input-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.input-group label{
  font-size:14px;
  font-weight:600;
}
.input-group input{
  width:100%;
  padding:12px;
  border:2px solid var(--main);
  border-radius:8px;
  background:transparent;
  color:var(--main);
  font-size:16px;
  outline:none;
}
.input-group input::placeholder{
  color:rgba(255,255,255,0.6);
}
.calc-btn{
  margin-top:6px;
  padding:14px;
  border:2px solid var(--main);
  background:var(--main);
  color:var(--bg);
  font-size:16px;
  font-weight:700;
  border-radius:8px;
  cursor:pointer;
}
.calc-btn:active{transform:scale(.98)}
.calc-result{
  margin-top:14px;
  padding:16px;
  border:2px solid var(--main);
  border-radius:8px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  background:rgba(255,255,255,0.1);
}

.contact{
  margin-top:auto;
  width:100%;
  padding:20px;
  border:2px solid var(--main);
  background:transparent;
  color:var(--main);
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  border-radius:14px;
}
.contact:active{transform:scale(.98)}

@media(max-width:360px){
  h1{font-size:42px}
  .intro{font-size:18px}
  .work-item span{font-size:23px}
}
</style>
</head>
<body>
<main class="card">
  <section class="top">
    <div class="label">MOBILE BUSINESS CARD</div>
    <h1>이유민</h1>
    <p class="intro">경기대학교 경영학과 학생<br>아이디어를 서비스와 디자인으로 연결합니다.</p>
  </section>

  <section class="work">
    <div class="work-title">WHAT I DO</div>
    <div class="work-item">
      <span>AI 서비스 기획</span>
      <span class="arrow">→</span>
    </div>
    <div class="work-item">
      <span>웹디자인</span>
      <span class="arrow">→</span>
    </div>
    <div class="work-item">
      <span>내면탐구</span>
      <span class="arrow">→</span>
    </div>
  </section>

  <!-- 모임 회비 나누기 계산기 -->
  <section class="calc-section">
    <div class="calc-title">DUTCH PAY CALCULATOR</div>
    <div class="calc-box">
      <div class="input-group">
        <label for="totalAmount">총 금액 (원)</label>
        <input type="number" id="totalAmount" placeholder="예: 50000" min="0">
      </div>
      <div class="input-group">
        <label for="personCount">인원수 (명)</label>
        <input type="number" id="personCount" placeholder="예: 4" min="1">
      </div>
      <button class="calc-btn" onclick="calculateSplit()">1인당 금액 계산하기</button>
      <div class="calc-result" id="resultText">금액과 인원을 입력해 주세요</div>
    </div>
  </section>

  <button class="contact" onclick="contact()">문의하기</button>
</main>

<script>
function calculateSplit(){
  const total = parseFloat(document.getElementById('totalAmount').value);
  const people = parseInt(document.getElementById('personCount').value);
  const resultElement = document.getElementById('resultText');

  if(isNaN(total) || isNaN(people) || total <= 0 || people <= 0){
    resultElement.innerText = "올바른 금액과 인원을 입력해 주세요.";
    return;
  }

  // 1인당 금액 계산 (원 단위 절사 처리)
  const perPerson = Math.floor(total / people);
  
  resultElement.innerText = `1인당 ${perPerson.toLocaleString()}원`;
}

function contact(){
  window.location.href="mailto:";
}
</script>
</body>
</html>
